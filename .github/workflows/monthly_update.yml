name: Weekly Transfermarkt Scrape

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Welke competities-batch scrapen?'
        type: choice
        default: core
        options:
          - core
          - big5
          - eastern_europe
          - continental_cups
          - national_teams

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 360
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    env:
      # Op deze Windows self-hosted runner is Python's stdout standaard cp1252
      # i.p.v. UTF-8 wanneer het niet aan een echte console hangt (bv. via de
      # Actions runner's process pipe). Zonder dit crasht elke print() met een
      # emoji of ander non-ASCII teken (UnicodeEncodeError).
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Controleer Python
        run: |
          # Op de self-hosted runner gebruiken we de al geïnstalleerde Python
          # i.p.v. actions/setup-python, die op deze machine een installer
          # probeert te draaien die geblokkeerd wordt.
          python3 --version
          pip3 --version || pip --version

      - name: Bepaal batch en actuele seizoenen
        run: |
          # Batch wordt altijd handmatig gekozen bij het starten van de run
          # (geen automatische rotatie: de self-hosted runner draait toch
          # enkel wanneer iemand hem zelf aanzet). Schedule-triggers hebben
          # geen inputs, die vallen terug op 'core'.
          BATCH="${{ github.event.inputs.batch || 'core' }}"
          echo "BATCH=$BATCH" >> $GITHUB_ENV
          echo "Gekozen batch: $BATCH"

          MONTH=$(date -u +%-m)
          YEAR=$(date -u +%Y)
          if [ "$MONTH" -ge 7 ]; then
            CURRENT_SEASON=$YEAR
          else
            CURRENT_SEASON=$((YEAR - 1))
          fi
          PREV_SEASON=$((CURRENT_SEASON - 1))

          STATE_FILE="data/csv/.scrape_state.json"
          LAST_FINALIZED=""
          if [ -f "$STATE_FILE" ]; then
            LAST_FINALIZED=$(STATE_FILE="$STATE_FILE" BATCH="$BATCH" python3 << 'PYEOF'
          import json
          import os

          state = json.load(open(os.environ['STATE_FILE']))
          finalized = state.get('last_finalized_season')
          batch = os.environ['BATCH']
          if isinstance(finalized, dict):
              print(finalized.get(batch) or '')
          else:
              # Oude platte state (van vóór de batches) gold enkel voor de 'core' batch.
              print(finalized or '' if batch == 'core' else '')
          PYEOF
          )
          fi

          # Vorig seizoen is afgerond en voor DEZE batch al eens volledig
          # opgehaald na die afronding: niet opnieuw scrapen. Huidig seizoen
          # loopt nog, dus altijd opnieuw. Elke batch houdt dit onafhankelijk
          # bij, anders zou een batch die nog nooit gedraaid heeft seizoenen
          # overslaan enkel omdat een ANDERE batch die al als afgerond
          # markeerde.
          if [ "$LAST_FINALIZED" = "$PREV_SEASON" ]; then
            SEASONS="$CURRENT_SEASON"
          else
            SEASONS="$PREV_SEASON $CURRENT_SEASON"
          fi

          echo "CURRENT_SEASON=$CURRENT_SEASON" >> $GITHUB_ENV
          echo "PREV_SEASON=$PREV_SEASON" >> $GITHUB_ENV
          echo "SEASONS=$SEASONS" >> $GITHUB_ENV
          echo "Laatst afgerond seizoen voor batch '$BATCH' (state): ${LAST_FINALIZED:-geen}"
          echo "Te scrapen seizoenen deze run: $SEASONS"

      - name: Install transfermarkt-scraper
        run: |
          pip install poetry
          rm -rf /tmp/scraper
          git clone --branch v0.4.0 https://github.com/dcaribou/transfermarkt-scraper.git /tmp/scraper
          cd /tmp/scraper
          rm -f poetry.lock
          python3 -m poetry config virtualenvs.create false
          python3 -m poetry install --without dev
          pip install aiohttp asyncio
          echo 'USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"' >> /tmp/scraper/tfmkt/settings.py
          echo 'ROBOTSTXT_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"' >> /tmp/scraper/tfmkt/settings.py
          # Deze self-hosted runner draait op een residentiële/werk-IP die niet
          # door Transfermarkt's bot-detectie geblokkeerd wordt (in tegenstelling
          # tot GitHub-hosted runners), dus geen throttling meer nodig hier - gewoon
          # Scrapy's eigen standaarden voor maximale doorvoersnelheid.
          echo 'CONCURRENT_REQUESTS = 32' >> /tmp/scraper/tfmkt/settings.py
          echo 'CONCURRENT_REQUESTS_PER_DOMAIN = 32' >> /tmp/scraper/tfmkt/settings.py
          echo 'RETRY_TIMES = 3' >> /tmp/scraper/tfmkt/settings.py
          python3 $GITHUB_WORKSPACE/patch_scraper.py "$(cygpath -w /tmp/scraper 2>/dev/null || echo /tmp/scraper)"

      - name: Maak output map aan
        run: mkdir -p data/raw data/csv

      - name: Stap 0 - Bestaande CSV data inladen
        run: python3 $GITHUB_WORKSPACE/scripts/merge_csv.py decompress

      - name: Stap 1 - Clubs scrapen
        run: |
          cd /tmp/scraper
          for SEASON in $SEASONS; do
            echo "=== Clubs seizoen $SEASON ==="
            # TIJDELIJK: LOG_LEVEL=INFO + DUPEFILTER_DEBUG om te zien waarom
            # de eastern_europe-batch 0 clubs oplevert (normaal LOG_LEVEL=ERROR,
            # dat verbergt dit soort "0 resultaten, geen crash" stil falen
            # volledig). Terugzetten naar ERROR zodra de oorzaak bekend is.
            python3 -m scrapy crawl clubs \
              -a parents=$GITHUB_WORKSPACE/data/competitions/$BATCH.json \
              -a season=$SEASON \
              -s LOG_LEVEL=INFO -s DUPEFILTER_DEBUG=1 \
              >> $GITHUB_WORKSPACE/data/raw/clubs.json || true
          done
          echo "Clubs nieuw: $(wc -l < $GITHUB_WORKSPACE/data/raw/clubs.json)"

      - name: Stap 2 - Spelers scrapen
        run: |
          cd /tmp/scraper
          for SEASON in $SEASONS; do
            echo "=== Spelers seizoen $SEASON ==="
            python3 -m scrapy crawl players \
              -a parents=$GITHUB_WORKSPACE/data/raw/clubs.json \
              -a season=$SEASON \
              >> $GITHUB_WORKSPACE/data/raw/players.json || true
          done
          echo "Spelers nieuw: $(wc -l < $GITHUB_WORKSPACE/data/raw/players.json)"

      - name: Stap 2b - Marktwaarden ophalen
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players.json'
          MV_FILE = RAW / 'market_values.json'
          MARKET_VALUES_API = "https://www.transfermarkt.com/ceapi/marketValueDevelopment/graph/"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36", "Accept": "application/json"}
          def get_player_ids():
              ids, seen = [], set()
              if not PLAYERS_FILE.exists(): return ids
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid and pid not in seen:
                                  ids.append(pid); seen.add(pid)
                      except: pass
              return ids
          async def fetch_mv(session, player_id, semaphore):
              async with semaphore:
                  url = f"{MARKET_VALUES_API}{player_id}"
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                          if resp.status == 200:
                              data = await resp.json(content_type=None)
                              values = data.get('list', [])
                              if values:
                                  return player_id, values[-1].get('mw', '')
                  except: pass
                  return player_id, None
          # Stap 1: haal marktwaarden rechtstreeks uit players.json (scraper pagina data)
          results = {}
          if PLAYERS_FILE.exists():
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' not in parts: continue
                          pid = parts[parts.index('spieler') + 1]
                          for field in ['current_market_value', 'market_value', 'marketValue']:
                              mv = p.get(field)
                              if mv and str(mv).strip() not in ('', 'None', '0', '-', 'null'):
                                  results[pid] = str(mv).strip()
                                  break
                      except: pass
          print(f"Marktwaarden uit scraper pagina: {len(results)} spelers")

          # Stap 2: ceapi voor spelers zonder waarde
          async def main():
              all_ids = []
              if PLAYERS_FILE.exists():
                  with open(PLAYERS_FILE, encoding='utf-8') as f:
                      seen = set(results.keys())
                      for line in f:
                          line = line.strip()
                          if not line: continue
                          try:
                              p = json.loads(line)
                              href = p.get('href', '')
                              parts = href.rstrip('/').split('/')
                              if 'spieler' in parts:
                                  pid = parts[parts.index('spieler') + 1]
                                  if pid not in seen:
                                      all_ids.append(pid)
                                      seen.add(pid)
                          except: pass
              print(f"Marktwaarden via ceapi voor {len(all_ids)} spelers zonder waarde...")
              semaphore = asyncio.Semaphore(3)
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_mv(session, pid, semaphore) for pid in all_ids]
                  done = 0
                  for coro in asyncio.as_completed(tasks):
                      pid, mv = await coro
                      if mv: results[pid] = mv
                      done += 1
                      if done % 500 == 0:
                          print(f"  {done}/{len(all_ids)} verwerkt, {len(results)} totaal met waarde")
              print(f"Klaar: {len(results)} marktwaarden totaal")
              with open(MV_FILE, 'w', encoding='utf-8') as f:
                  json.dump(results, f)
          asyncio.run(main())
          PYEOF
          echo "Marktwaarden: $(wc -c < $GITHUB_WORKSPACE/data/raw/market_values.json 2>/dev/null || echo 0) bytes"

      - name: Stap 2c - Transferhistorie ophalen via API
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players.json'
          TRANSFERS_FILE = RAW / 'transfers.json'
          TRANSFERS_API = "https://www.transfermarkt.co.uk/ceapi/transferHistory/list/"
          HEADERS = {"User-Agent": "transfermarkt-datasets/1.0", "Accept": "application/json"}
          def get_player_ids():
              ids, seen = [], set()
              if not PLAYERS_FILE.exists(): return ids
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid and pid not in seen:
                                  ids.append(pid); seen.add(pid)
                      except: pass
              return ids
          async def fetch_transfers(session, player_id, semaphore):
              async with semaphore:
                  url = f"{TRANSFERS_API}{player_id}"
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                          if resp.status == 200:
                              data = await resp.json(content_type=None)
                              transfers = data.get('transfers', [])
                              return player_id, transfers
                  except: pass
                  return player_id, []
          async def main():
              player_ids = get_player_ids()
              print(f"Transfers ophalen voor {len(player_ids)} spelers...")
              semaphore = asyncio.Semaphore(10)
              all_transfers = []
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_transfers(session, pid, semaphore) for pid in player_ids]
                  done = 0
                  for coro in asyncio.as_completed(tasks):
                      pid, transfers = await coro
                      for t in transfers:
                          t['player_id'] = pid
                          all_transfers.append(t)
                      done += 1
                      if done % 500 == 0:
                          print(f"  {done}/{len(player_ids)} verwerkt, {len(all_transfers)} transfers")
              print(f"Klaar: {len(all_transfers)} transfers gevonden")
              with open(TRANSFERS_FILE, 'w', encoding='utf-8') as f:
                  for t in all_transfers:
                      f.write(json.dumps(t) + '\n')
          asyncio.run(main())
          PYEOF
          echo "Transfers: $(wc -l < $GITHUB_WORKSPACE/data/raw/transfers.json 2>/dev/null || echo 0)"

      - name: Wacht na transfers (IP cooldown)
        run: |
          echo "Wachten 3 minuten..."
          sleep 180

      - name: Stap 2d - Historische marktwaarden ophalen via API
        timeout-minutes: 30
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp
          from pathlib import Path
          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players.json'
          VALUATIONS_FILE = RAW / 'valuations.json'
          MV_API = "https://www.transfermarkt.com/ceapi/marketValueDevelopment/graph/"
          HEADERS = {"User-Agent": "transfermarkt-datasets/1.0", "Accept": "application/json"}
          def get_player_ids():
              ids, seen = [], set()
              if not PLAYERS_FILE.exists(): return ids
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      try:
                          p = json.loads(line)
                          href = p.get('href', '')
                          parts = href.rstrip('/').split('/')
                          if 'spieler' in parts:
                              pid = parts[parts.index('spieler') + 1]
                              if pid and pid not in seen:
                                  ids.append(pid); seen.add(pid)
                      except: pass
              return ids
          async def fetch_valuations(session, player_id, semaphore):
              async with semaphore:
                  url = f"{MV_API}{player_id}"
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=10)) as resp:
                          if resp.status == 200:
                              data = await resp.json(content_type=None)
                              values = data.get('list', [])
                              return player_id, values
                  except: pass
                  return player_id, []
          async def main():
              player_ids = get_player_ids()
              print(f"Valuations ophalen voor {len(player_ids)} spelers...")
              semaphore = asyncio.Semaphore(10)
              all_vals = []
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_valuations(session, pid, semaphore) for pid in player_ids]
                  done = 0
                  for coro in asyncio.as_completed(tasks):
                      pid, values = await coro
                      for v in values:
                          v['player_id'] = pid
                          all_vals.append(v)
                      done += 1
                      if done % 500 == 0:
                          print(f"  {done}/{len(player_ids)} verwerkt, {len(all_vals)} waardes")
              print(f"Klaar: {len(all_vals)} marktwaarden gevonden")
              with open(VALUATIONS_FILE, 'w', encoding='utf-8') as f:
                  for v in all_vals:
                      f.write(json.dumps(v) + '\n')
          asyncio.run(main())
          PYEOF
          echo "Valuations: $(wc -l < $GITHUB_WORKSPACE/data/raw/valuations.json 2>/dev/null || echo 0)"

      - name: Stap 3 - Optredens ophalen via API
        timeout-minutes: 120
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import json, asyncio, aiohttp, os
          from pathlib import Path
          from datetime import datetime

          RAW = Path('data/raw')
          PLAYERS_FILE = RAW / 'players.json'
          APPEARANCES_FILE = RAW / 'appearances.json'
          PERFORMANCE_API = "https://www.transfermarkt.co.uk/ceapi/performance-game/"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36", "Accept": "application/json"}

          TARGET_SEASONS = {int(s) for s in os.environ.get('SEASONS', '').split()}

          def extract_player_id(href):
              parts = href.rstrip('/').split('/')
              if 'spieler' in parts:
                  return parts[parts.index('spieler') + 1]
              return None

          def load_players():
              players = []
              if not PLAYERS_FILE.exists():
                  return players
              with open(PLAYERS_FILE, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          p = json.loads(line)
                      except Exception:
                          continue
                      href = p.get('href', '')
                      pid = extract_player_id(href)
                      if pid:
                          players.append({
                              'id': pid, 'href': href,
                              'name': p.get('name', ''), 'last_name': p.get('last_name', ''),
                          })
              return players

          async def fetch_performance(session, player, semaphore):
              async with semaphore:
                  url = f"{PERFORMANCE_API}{player['id']}"
                  try:
                      async with session.get(url, headers=HEADERS, timeout=aiohttp.ClientTimeout(total=15)) as resp:
                          if resp.status == 200:
                              data = await resp.json(content_type=None)
                              return player, (data.get('data') or {}).get('performance', [])
                  except Exception:
                      pass
                  return player, []

          def build_appearance(player, entry):
              game_info = entry.get('gameInformation') or {}
              season_id = game_info.get('seasonId')
              if season_id not in TARGET_SEASONS:
                  return None

              stats = entry.get('statistics') or {}
              general = stats.get('generalStatistics') or {}
              goal_stats = stats.get('goalStatistics') or {}
              card_stats = stats.get('cardStatistics') or {}
              time_stats = stats.get('playingTimeStatistics') or {}
              club_info = (entry.get('clubsInformation') or {}).get('club') or {}

              date_str = ''
              raw_date = (game_info.get('date') or {}).get('dateTimeUTC')
              if raw_date:
                  try:
                      dt = datetime.fromisoformat(raw_date.replace('Z', '+00:00'))
                      date_str = dt.strftime('%d/%m/%y')
                  except Exception:
                      date_str = ''

              game_id = game_info.get('gameId', '')
              club_id = club_info.get('clubId', '')

              return {
                  'parent': {
                      'href': player['href'],
                      'name': player['name'],
                      'last_name': player['last_name'],
                      'current_club': {'href': f"/club/verein/{club_id}"} if club_id else {},
                  },
                  'date': date_str,
                  'competition_code': game_info.get('competitionId', ''),
                  'yellow_cards': card_stats.get('yellowCard', 0) or 0,
                  'red_cards': card_stats.get('redCard', 0) or 0,
                  'goals': goal_stats.get('goalsScoredTotal', 0) or 0,
                  'assists': goal_stats.get('assists', 0) or 0,
                  'minutes_played': time_stats.get('playedMinutes', 0) or 0,
                  'position_in_game': '',
                  'result': {'href': f"/spielbericht/{game_id}"} if game_id else {},
              }

          async def main():
              players = load_players()
              print(f"Optredens ophalen voor {len(players)} spelers (seizoenen: {sorted(TARGET_SEASONS)})...")
              semaphore = asyncio.Semaphore(10)
              written = 0
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_performance(session, p, semaphore) for p in players]
                  done = 0
                  with open(APPEARANCES_FILE, 'a', encoding='utf-8') as out:
                      for coro in asyncio.as_completed(tasks):
                          player, entries = await coro
                          for entry in entries:
                              record = build_appearance(player, entry)
                              if record:
                                  out.write(json.dumps(record) + '\n')
                                  written += 1
                          done += 1
                          if done % 500 == 0:
                              print(f"  {done}/{len(players)} verwerkt, {written} optredens geschreven")
              print(f"Klaar: {written} optredens voor seizoenen {sorted(TARGET_SEASONS)}")

          asyncio.run(main())
          PYEOF
          echo "Optredens nieuw: $(wc -l < $GITHUB_WORKSPACE/data/raw/appearances.json)"

      - name: Stap 4 - Wedstrijden scrapen
        timeout-minutes: 120
        continue-on-error: true
        run: |
          cd /tmp/scraper
          for SEASON in $SEASONS; do
            echo "=== Wedstrijden seizoen $SEASON ==="
            python3 -m scrapy crawl games \
              -a parents=$GITHUB_WORKSPACE/data/competitions/$BATCH.json \
              -a season=$SEASON \
              >> $GITHUB_WORKSPACE/data/raw/games.json || true
          done
          echo "Wedstrijden nieuw: $(wc -l < $GITHUB_WORKSPACE/data/raw/games.json)"

      - name: Stap 5 - JSON naar CSV omzetten en samenvoegen
        run: python3 $GITHUB_WORKSPACE/scripts/merge_csv.py merge

      - name: Commit en push CSVs
        run: |
          git config user.name "ScoutAI Bot"
          git config user.email "actions@users.noreply.github.com"

          bump_state_and_commit() {
            for f in data/csv/*.csv; do [ -f "$f" ] && gzip -f "$f" || true; done
            BATCH="$BATCH" PREV_SEASON="$PREV_SEASON" python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          state_path = Path('data/csv/.scrape_state.json')
          state = json.load(open(state_path)) if state_path.exists() else {}
          finalized = state.get('last_finalized_season')
          if not isinstance(finalized, dict):
              finalized = {}
          finalized[os.environ['BATCH']] = int(os.environ['PREV_SEASON'])
          state['last_finalized_season'] = finalized
          json.dump(state, open(state_path, 'w'))
          PYEOF
            git add data/csv/
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M)
            git commit -m "ScoutAI data update ${TIMESTAMP}" || echo "Geen wijzigingen"
          }

          bump_state_and_commit

          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push mislukt (poging $i) - een andere run was intussen sneller."
            # Elke run herschrijft alle CSV's volledig, dus elke data-commit
            # raakt letterlijk elk .csv.gz-bestand. Git kan twee binaire
            # bestanden nooit automatisch samenvoegen (rebase/merge loopt
            # hier dan ook GEGARANDEERD vast, niet toevallig soms). De
            # enige correcte fix: eigen commit weggooien, de nieuwste
            # gepushte data/csv/-stand nemen, en de al opgehaalde ruwe JSON
            # (data/raw/, nooit in git, overleeft deze reset) daar opnieuw
            # tegen samenvoegen via de bestaande upsert-per-id logica.
            git fetch origin master
            git reset --hard origin/master
            python3 "$GITHUB_WORKSPACE/scripts/merge_csv.py" decompress
            python3 "$GITHUB_WORKSPACE/scripts/merge_csv.py" merge
            bump_state_and_commit
          done
          echo "Push bleef mislukken na meerdere pogingen."
          exit 1

      - name: Samenvatting
        run: |
          echo "=== SCRAPING KLAAR ==="
          for f in data/csv/*; do
            echo "$f: $(wc -c < $f) bytes"
          done
